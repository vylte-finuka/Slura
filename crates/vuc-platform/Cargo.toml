[package]
name = "vuc-platform"
version = "0.1.0"
edition = { workspace = true }

[features]
default  = ["std"]
std      = [
    "tokio/full",
    "tower-http",
    "tower",
    "hyper",
    "jsonrpsee",
    "jsonrpsee-server",
    "jsonrpsee-types",
    "jsonrpsee-http-client",
    "ethers",
    "local-ip-address",
    "rayon",
    "futures-util",
    "tracing-subscriber",
]
safe_mode = []

[dependencies]
# ── Toujours présents ──────────────────────────────────────
vuc-core     = { path = "../vuc-core",    default-features = false, features = ["std"] }
vuc-tx       = { path = "../vuc-tx" }
vuc-types    = { path = "../vuc-types" }
vuc-storage  = { path = "../vuc-storage" }
vuc-events   = { path = "../vuc-events" }
uvm-runtime  = { workspace = true }
serde        = { workspace = true, features = ["derive"] }
serde_json   = { workspace = true }
bcs          = { workspace = true }
anyhow       = "1.0.98"
hex          = "0.4"
chrono       = { workspace = true, features = ["serde"] }
tracing      = { workspace = true }
rand_chacha  = { workspace = true }
rand         = { workspace = true }
num-traits   = { workspace = true }
hashbrown    = { workspace = true }
futures      = { workspace = true }
prometheus   = { workspace = true }
fastcrypto   = { workspace = true }
bincode      = { workspace = true }
sha3         = { workspace = true }
base64       = { workspace = true }
lazy_static  = { workspace = true }
clap         = { version = "4.5", features = ["derive"] }
ipnetwork    = "0.20"
miniz_oxide  = "0.9.0"
percent-encoding = "2.3.1"
k256         = "0.13.4"
sha_256      = "1.0.1"
base64-url   = "3.0.2"
rlp          = "0.5.2"
typenum      = "1.19.0"
dotenv       = "0.15"
alloy-primitives = "1.4.1"
tiny-keccak  = "2.0.2"
num_cpus     = "1.17.0"
primitive-types = { workspace = true }
reth-trie    = { git = "https://github.com/paradigmxyz/reth.git", tag = "v1.9.1", package = "reth-trie" }
reth-primitives = { git = "https://github.com/paradigmxyz/reth.git", tag = "v1.9.1", package = "reth-primitives" }

# ── Std seulement (réseau, async, HTTP) ───────────────────
tokio            = { workspace = true, optional = true }
tower            = { version = "0.5",  optional = true }
hyper            = { version = "1.5",  optional = true }
tower-http       = { version = "0.6",  optional = true, features = ["cors", "compression-full", "sensitive-headers", "trace", "timeout"] }
jsonrpsee        = { version = "0.26", optional = true, features = ["server", "http-client", "ws-client", "macros", "client-ws-transport-tls"] }
jsonrpsee-server = { workspace = true, optional = true }
jsonrpsee-types  = { workspace = true, optional = true }
jsonrpsee-http-client = { version = "0.26.0", optional = true }
ethers           = { version = "2.0.14", optional = true }
local-ip-address = { version = "0.5",  optional = true }
rayon            = { workspace = true, optional = true }
futures-util     = { version = "0.3.31", optional = true }
tracing-subscriber = { version = "0.2.15", optional = true }

[[bin]]
name = "vuc-platform"
path = "src/engine_platform.rs"

[package.metadata]
license     = "Vylte-finuka"
description = "Vyft slurachain smart contract platform."
