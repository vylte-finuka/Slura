[package]
name        = "vuc-core"
version     = "0.1.0"
edition     = { workspace = true }

[features]
default  = ["std"]
std      = [
    "tokio/full",
    "serde/derive",
    "rand",
    "chrono",
    "hashbrown/default",
    "tracing",
    "futures",
    "md5",
]
kernel   = [
    "uefi/alloc",
    "sha2/force-soft",
    "serde/derive",
]

[dependencies]
# ── Toujours présents ──────────────────────────────────────
vuc-types  = { path = "../vuc-types" }
vuc-events = { path = "../vuc-events" }
vuc-common = { path = "../vuc-common" }
sha2       = { workspace = true, default-features = false }
hashbrown  = { workspace = true, default-features = false }
serde      = { workspace = true, default-features = false }

# ── Std seulement ─────────────────────────────────────────
tokio      = { workspace = true, optional = true }
rand       = { workspace = true, optional = true }
chrono     = { workspace = true, optional = true }
tracing    = { workspace = true, optional = true }
futures    = { workspace = true, optional = true }
md5        = { workspace = true, optional = true }

# ── Kernel seulement ──────────────────────────────────────
uefi          = { version = "0.32", optional = true }
uefi-services = { version = "0.24.0", optional = true }

[profile.release]
opt-level     = "s"
lto           = true
codegen-units = 1
panic         = "abort"

[lib]
name       = "vuc_core"
crate-type = ["staticlib"]
path       = "src/lib.rs"

[package.metadata]
license     = "Vylte-finuka"
description = "Vyft slurachain framework."
