[package]
name        = "vuc-core"
version     = "0.1.0"
edition     = { workspace = true }

[features]
# ── Le crate ne fournit plus la partie kernel ──
default = []          # aucune feature activée par défaut
std     = []          # on désactive complètement la feature std (à activer explicitement)
no_std  = []          # aucune dépendance std‑only – utile pour les dépendants

[dependencies]
# ── Dépendances toujours présentes (ne tirent pas std) ──
vuc-types  = { path = "../vuc-types" }
vuc-events = { path = "../vuc-events" }
vuc-common = { path = "../vuc-common" }
sha2       = { workspace = true, default-features = false }
hashbrown  = { workspace = true, default-features = false }
serde      = { workspace = true, default-features = false }

# ── Dépendances réservées à la feature `std` (optionnelles) ──
tokio   = { workspace = true, optional = true }
rand    = { workspace = true, optional = true }
chrono  = { workspace = true, optional = true }
tracing = { workspace = true, optional = true }
futures = { workspace = true, optional = true }
md5     = { workspace = true, optional = true }

[profile.release]
opt-level     = "s"
lto           = true
codegen-units = 1
panic         = "abort"

[lib]
name       = "vuc_core"
crate-type = ["staticlib", "rlib"]
path       = "src/lib.rs"

[package.metadata]
license     = "Vylte-finuka"
description = "Vyft slurachain framework."
