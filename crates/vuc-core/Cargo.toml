[package]
name = "vuc-core"
version = "0.1.0"
edition = { workspace = true }

[dependencies]
# === UEFI Core ===
uefi = { version = "0.32", features = ["alloc"] }
uefi-services = "0.28"

# === Fixes bare-metal obligatoires ===
getrandom = { version = "0.2", features = ["custom"] }
hashbrown = { version = "0.14", features = ["ahash"] }

# === Crates internes ===
vuc-types = { path = "../vuc-types" }
vuc-events = { path = "../vuc-events" }
vuc-common = { path = "../vuc-common" }

# === Dépendances allégées ===
serde = { workspace = true, default-features = false, features = ["derive"] }
rand = { workspace = true, default-features = false, features = ["std_rng"] }
sha2 = { workspace = true, default-features = false }
md5 = { workspace = true, default-features = false }

# === Bloquer les crates réseau ===
tokio = { workspace = true, optional = true, default-features = false, features = [] }
mio = { version = "1", default-features = false, features = [] }   # bloqué
socket2 = { version = "0.5", default-features = false, features = [] }

[lib]
name = "vuc_core"
crate-type = ["staticlib"]
path = "src/lib.rs"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"

[features]
default = ["full"]
full = ["serde/derive"]
