[package]
name = "lunee-ker"
version = "0.1.0"
edition = "2021"

[dependencies]
heapless = "0.9.3"

# Dépendances UEFI (nécessaires au kernel)
uefi          = { version = "0.27.0",  default-features = false, features = ["alloc"] }
uefi-services = "0.24.0"

# Décompression DEFLATE pour les bundles Maratine (ZIP méthode 8)
miniz_oxide   = { version = "0.7", default-features = false }

# SHA-256 pour AuthARoot (no_std)
sha2          = { workspace = true }


[[bin]]
name = "lunee-ker"
path = "src/main.rs"

# ── Pas de feature std ici ──
[features]
default = []          # aucune feature activée par défaut
# (aucune feature `with_socket2` ou similaire – tout est désactivé)

[lib]
name = "lunee_ker"
crate-type = ["staticlib"]