[package]
name    = "vuc-events"
version = "0.1.0"
edition = { workspace = true }

[features]
default = ["std"]
std     = [
    "tokio/full",
    "tracing",
    "futures",
]

[dependencies]
# ── Toujours présents ──────────────────────────────────────
serde     = { workspace = true, default-features = false, features = ["derive"] }
md5       = { workspace = true, default-features = false }
hashbrown = { workspace = true, default-features = false }
chrono    = { workspace = true, default-features = false, features = ["serde"] }

# ── Std seulement ─────────────────────────────────────────
tokio   = { workspace = true, default-features = false, optional = true }
tracing = { workspace = true, default-features = false, optional = true }
futures = { workspace = true, default-features = false, optional = true }

[lib]
name = "vuc_events"
path = "src/lib.rs"

[package.metadata]
license     = "Vylte-finuka"
description = "Vyft slurachain event onchain library."
