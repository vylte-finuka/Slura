<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<style>
  body {
    font-family: Inter, "Segoe UI", sans-serif;
    font-size: 12px;
    margin: 0;
    padding: 16px;
    color: #1a1a1a;
  }
  h1 {
    font-size: 13px;
    margin: 0 0 8px 0;
  }
  p {
    color: #666;
    line-height: 1.4;
  }
  button {
    background: #18a0fb;
    color: white;
    border: none;
    border-radius: 6px;
    padding: 8px 14px;
    font-size: 12px;
    cursor: pointer;
    margin-right: 8px;
  }
  button.secondary {
    background: #e5e5e5;
    color: #1a1a1a;
  }
  #status {
    margin-top: 12px;
    padding: 8px;
    background: #f5f5f5;
    border-radius: 6px;
    min-height: 32px;
    white-space: pre-wrap;
  }
  label {
    display: block;
    margin: 10px 0 4px 0;
    color: #333;
  }
  label.check {
    display: flex;
    align-items: center;
    gap: 6px;
    margin: 12px 0;
  }
  input[type="text"] {
    width: 100%;
    box-sizing: border-box;
    padding: 6px 8px;
    border: 1px solid #ccc;
    border-radius: 6px;
    font-size: 12px;
  }
  .buttons {
    margin-top: 8px;
  }
</style>
</head>
<body>
  <h1>MaratineKit tool's builder</h1>
  <p>Sélectionnez un frame représentant un écran d'app, puis générez ses sources Maratine (.marep) prêtes pour <code>marai build</code>.</p>

  <label for="appname">Nom de l'app (vide = nom du frame)</label>
  <input id="appname" type="text" placeholder="ShiNotes" />

  <label class="check">
    <input id="desktop" type="checkbox" />
    Ceci est le bureau/shell (boucle de fenêtres WindowMan dans LAPrevent)
  </label>

  <div class="buttons">
    <button id="generate">Générer le .marep.zip</button>
    <button id="cancel" class="secondary">Fermer</button>
  </div>
  <div id="status"></div>

  <script>
    __BUNDLE_JS__
  </script>
</body>
</html>
