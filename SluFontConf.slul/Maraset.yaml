# --------------------------------------------------------------
# Maraset – manifest du package *.slul* pour Slura OS
# --------------------------------------------------------------

package:
  name: base***SluFontConf
  version: 1.0.0
  build: 20260623-01

metadata:
  target: arm64
  bundle: slul
  attributes:
    SRID: SRID_slufontconf_001
    Marav: 0.1 build 06260912-dev
    description: |
      Driver de polices TrueType pour Slura OS.
      Charge brsonomasemibold.ttf depuis C:\assets\fonts\.
      Expose FontLoad, FontGetDefault, FontGetHeight, MeasureText,
      RenderText via DrvAPIInterCon / DrvManSpec.
      Parseur TTF natif (cmap format 4, glyf, loca, hhea, hmtx).
    slura_min: 1
    slura_max: 5.0

dependencies:
  basecon:
    base***example***APrevent: 1.0.0
    base***example***OEntry:   1.0.0

resources:
  - path: RAbstractallowing.xml
    type: xml
    description: "Règles d'autorisation pour le driver de polices."

assets:
  - path: C:\assets\fonts\brsonomasemibold.ttf
    type: font/ttf
    description: "Police TrueType Brsono Ma Semi Bold — police système Slura OS."
