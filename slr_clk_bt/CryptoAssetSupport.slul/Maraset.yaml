# Maraset – manifest CryptoAssetSupport.slul

package:
  name: base***CryptoAssetSupport
  version: 1.0.0
  build: 25072616

metadata:
  target: arm64
  bundle: slul
  attributes:
    SRID: SRID_slura_os_29062617
    Marav: 0.1 build 25072616-dev
    description: |
      Driver Slura OS – Support natif des actifs crypto (*.ca) dans SRFS.
      Supporte deux formats :
        – Actif simple : SDC:\slu64\assets\crypto\<SYMBOL>.ca
        – Bundle multi-contrats : SDC:\slu64\assets\crypto\<name>.ca
          (ex. vezcurproxy.ca contenant VEZproxy+reservVEZ+VEZcustodian)
      API : RegisterAsset, GetAsset, RegisterBundle, GetContractInBundle,
            TransferAsset, UpdateBalance, ListAssets.
    slura_min: 1
    slura_max: 5.0

dependencies:
  basecon:
    base***SluraOS***APrevent: 25072616
    base***SluraOS***OEntry:   25072616

