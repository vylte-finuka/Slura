package:
  name: base***ShiLauncher
  version: v1 NAVERTA build 29062617
  build: 20260707-01

metadata:
  bundle: marep
  target: arm64
  attributes:
    SRID: SRID_shilauncher
    Marav: 0.1 build 20260707-01
    icon: ShiLauncher.slasset/img4.png
    display_name: "ShiLauncher"
    description: |
      ShiLauncher — Application Slura OS
    slura_min: 1
    slura_max: 5.0

  entry: OEntry
  lifecycle: LAPrevent

  permissions:
    - gpu.framebuffer
    - fs.read
    - fs.write
    - ipc.send
    - ipc.recv

  assets:
    - ShiLauncher.slasset/

dependencies:
  basecon:
    base***LAPrevent: 1.0.0
    base***OEntry: 1.0.0

resources:
  - path: RAbstractallowing.xml
    type: xml
    description: "Règles d'autorisation abstraites pour le sandbox Slura."

scripts:
  postinstall: |
    slura-reg add --srid ${metadata.attributes.SRID}
