package:
  name: base***ShiLauncher
  version: v1 NAVERTA build 20260720-01
  build: 21072607

metadata:
  bundle: marep
  target: arm64
  attributes:
    SRID: SRID_slura_os_29062617
    Marav: 0.1 build 21072607
    icon: ShiLauncher.slasset/ShiLauncher.png
    display_name: "ShiLauncher  - Shixbook screen"
    diamond_color: "0x33B9B9B9"
    description: |
      ShiLauncher — application Slura OS générée par MaratineKit tool's builder.
    slura_min: 1
    slura_max: 5.0
  dock_menu_items: "New Folder|New File>txt,md,bmp|Mount SDC|Mount A"

  entry: OEntry
  lifecycle: LAPrevent

  permissions:
    - gpu.framebuffer
    - fs.read
    - fs.write

  assets:
    - ShiLauncher.slasset/

dependencies:
  basecon:
    base***LAPrevent: 1.0.0
    base***OEntry: 1.0.0

resources:
  - path: RAbstractallowing.xml
    type: xml
    description: "Règles d'autorisation abstraites pour le sandbox Slura."

scripts:
  postinstall: |
    slura-reg add --srid ${metadata.attributes.SRID}
