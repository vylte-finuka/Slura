package:
  name: base***ShiLooker
  version: v1 NAVERTA build 20260711-01
  build: 25072619

metadata:
  bundle: marep
  target: arm64
  attributes:
    SRID: SRID_shilooker
    Marav: 0.1 build 25072619
    icon: ShiLooker.slasset/ShiLooker.png
    display_name: "ShiLooker"
    description: |
      ShiLooker — application Slura OS générée par MaratineKit tool's builder.
    slura_min: 1
    slura_max: 5.0

  entry: OEntry
  lifecycle: LAPrevent

  permissions:
    - gpu.framebuffer
    - fs.read
    - fs.write

  assets:
    - ShiLooker.slasset/

dependencies:
  basecon:
    base***LAPrevent: 1.0.0
    base***OEntry: 1.0.0

resources:
  - path: RAbstractallowing.xml
    type: xml
    description: "Règles d'autorisation abstraites pour le sandbox Slura."

dock_menu_items: "Notifications & Widgets|Apps, folders & disks|Mounting a hard disk|Unmounting a hard disk|Installing a app from thirds source|Looking a reference|Looking disk's capacity|About|@ShiLauncher"

scripts:
  postinstall: |
    slura-reg add --srid ${metadata.attributes.SRID}
