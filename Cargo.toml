[workspace]
members = [
    "crates/vuc-core",
    "crates/vuc-core/lunee-ker",
    "crates/vuc-core/getrandom-uefi",
    "crates/vuc-platform-uefi",
    "crates/vuc-events",
    "crates/vuc-types",
    "crates/vuc-common",
    "crates/vuc-platform",
    "crates/vuc-reader",
    "crates/vuc-storage",
    "crates/vuc-tx",
    "crates/vuc-reader/src/uvm/runtime",
]
resolver = "2"

[workspace.package]
authors     = ["Vylte-finuka <vylte-finuka@vylte-finuka.com>"]
edition     = "2021"
homepage    = "vylte-finuka.com"
license     = "Apache-2.0"
publish     = false
repository  = "https://github.com/vyftteam/slurachain"
rust-version = "1.80.1"

[workspace.dependencies]
anyhow          = "1.0.98"
serde           = { version = "1.0.193", default-features = false }
serde_derive    = "1.0.193"
serde_json      = { version = "1.0.81", default-features = false, features = ["preserve_order", "arbitrary_precision"] }
rand            = { version = "0.8.5", default-features = false }
rand_chacha     = { version = "0.3.1", default-features = false }
bytes           = { version = "1.4.0", default-features = false, features = ["serde"] }
bcs             = "0.1.6"
hashbrown       = { version = "0.15", default-features = false }
lazy_static     = "1.4.0"
num-traits      = { version = "0.2.19", default-features = false }
hex             = { version = "0.4.3", default-features = false, features = ["serde"] }
bincode         = "1.3.3"
tokio           = { version = "1.35.1", default-features = false }
futures         = { version = "0.3.29", default-features = false }
tracing         = { version = "0.1.37", default-features = false }
log             = { version = "0.4.17", default-features = false }
base64          = { version = "0.22.1", default-features = false }
chrono          = { version = "0.4.19", default-features = false }
fastcrypto      = { version = "0.1.9", default-features = false }
md5             = { version = "0.7.0", default-features = false }
sha2            = { version = "0.9.3", default-features = false }
sha3            = { version = "0.9.1", default-features = false }
jsonrpsee-server = "0.26.0"
jsonrpsee-types  = "0.26.0"
prometheus      = { version = "0.13.3", default-features = false }
primitive-types = { version = "0.12", default-features = false }
rayon           = "1.5.2"
smallvec        = { version = "1.8.0", default-features = false }
uvm-runtime     = { path = "crates/vuc-reader/src/uvm/runtime" }

# getrandom ne supporte pas UEFI nativement.
# Pour la cible x86_64-unknown-uefi, on force le backend "custom"
# qui utilise le RNG EFI_RNG_PROTOCOL (enregistré depuis lunee-ker).
[patch.crates-io]
getrandom = { path = "crates/vuc-core/getrandom-uefi" }
